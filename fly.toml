# fly.toml app configuration file generated for gator on 2025-07-15T11:44:38-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gator'
primary_region = 'sea'

[build]
  [build.args]
    GO_VERSION = '1.27.3'

[env]
  PORT = '8080'
  DATABASE_PATH = '/data/gator.db'

[mounts]
  source = "gator_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # A deploy to a running machine waits for this, so failed migrations fail that deploy.
  # A stopped machine stays stopped during a deploy, so this check doesn't run then.
  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/posts'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
