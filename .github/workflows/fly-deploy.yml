name: Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: deploy-group
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install golangci-lint
        run: |
          make install-lint
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check format, build, lint, and tests
        run: make check
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@1.5
        with:
          # Pinned: an unpinned flyctl hung a deploy (.scratch/ci-migrations-hang).
          version: 0.5.3
      - name: Deploy to Fly.io
        # The container runs migrations on start (see Dockerfile CMD).
        run: flyctl deploy --remote-only
