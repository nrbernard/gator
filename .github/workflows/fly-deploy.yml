name: Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install golangci-lint
        # Pinned: must be built with a Go at least as new as go.mod's.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check format, build, lint, and tests
        run: make check
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
      - name: Get machine ID
        id: get_machine_id
        run: |
          MACHINE_ID=$(flyctl machines list --json | jq -r '.[0].id')
          if [ "$MACHINE_ID" != "null" ] && [ -n "$MACHINE_ID" ]; then
            echo "machine_id=$MACHINE_ID" >> $GITHUB_OUTPUT
          else
            echo "Failed to get machine ID"
            exit 1
          fi
    outputs:
      machine_id: ${{ steps.get_machine_id.outputs.machine_id }}
  
  migrate:
    name: Run migrations
    runs-on: ubuntu-latest
    needs: deploy
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      MACHINE_ID: ${{ needs.deploy.outputs.machine_id }}
      DATABASE_PATH: /data/gator.db
    steps:
      - uses: actions/checkout@v4
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Start machine
        run: |
          echo "Starting machine $MACHINE_ID..."
          flyctl machines start "$MACHINE_ID"
      - name: Run migrations
        run: |
          flyctl console --machine "$MACHINE_ID" --command "make migrate-up"
